<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087443">

<title>পথচেনা BD | PothChena BD</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f8f5;
color:#183b2b;
}

header{
background:#087443;
color:white;
padding:20px;
text-align:center;
}

header h1{margin:0;font-size:28px}

.hero{
background:linear-gradient(135deg,#075b39,#16a36a);
color:white;
padding:45px 15px;
text-align:center;
}

.search{
width:95%;
max-width:550px;
padding:15px;
border:0;
border-radius:10px;
font-size:16px;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:14px;
}

.card{
background:white;
padding:20px 10px;
text-align:center;
border-radius:12px;
box-shadow:0 2px 10px #00000010;
cursor:pointer;
}

.card:hover{
background:#e2f5e9;
}

.icon{font-size:30px}

.district{
display:inline-block;
background:white;
padding:12px;
margin:5px;
border-radius:8px;
border:1px solid #cce5d5;
cursor:pointer;
}

.district:hover{
background:#087443;
color:white;
}

.place{
background:white;
padding:18px;
margin:12px 0;
border-radius:12px;
}

.place a{
color:#087443;
font-weight:bold;
text-decoration:none;
}

footer{
background:#075b39;
color:white;
text-align:center;
padding:25px;
margin-top:40px;
}

button{
cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>🇧🇩 পথচেনা BD</h1>
<p>বাংলাদেশ চিনুন, সহজে ঘুরে বেড়ান</p>
</header>

<section class="hero">
<h2>ঘুরে দেখুন প্রিয় বাংলাদেশ</h2>
<p>আপনার পছন্দের জায়গা খুঁজে নিন</p>

<input
class="search"
id="search"
type="search"
placeholder="জেলা বা দর্শনীয় স্থানের নাম লিখুন..."
oninput="searchPlaces()">
</section>

<div class="container">

<h2>🗺️ বাংলাদেশের ৮টি বিভাগ</h2>
<div class="grid" id="divisions"></div>

<h2>📍 জেলার তালিকা</h2>
<div id="districts">
একটি বিভাগ নির্বাচন করুন।
</div>

<h2>🏞️ জনপ্রিয় দর্শনীয় স্থান</h2>
<div id="places"></div>

</div>

<footer>
<h3>🇧🇩 পথচেনা BD</h3>
<p>বাংলাদেশের ৬৪ জেলার ভ্রমণসঙ্গী</p>
<p>© 2026 PothChena BD</p>
</footer>

<script>

const data = {

"ঢাকা":[
"ঢাকা","ফরিদপুর","গাজীপুর","গোপালগঞ্জ",
"কিশোরগঞ্জ","মাদারীপুর","মানিকগঞ্জ",
"মুন্সিগঞ্জ","নারায়ণগঞ্জ","নরসিংদী",
"রাজবাড়ী","শরীয়তপুর","টাঙ্গাইল"
],

"চট্টগ্রাম":[
"বান্দরবান","ব্রাহ্মণবাড়িয়া","চাঁদপুর",
"চট্টগ্রাম","কুমিল্লা","কক্সবাজার",
"ফেনী","খাগড়াছড়ি","লক্ষ্মীপুর",
"নোয়াখালী","রাঙামাটি"
],

"রাজশাহী":[
"বগুড়া","জয়পুরহাট","নওগাঁ","নাটোর",
"চাঁপাইনবাবগঞ্জ","পাবনা","রাজশাহী","সিরাজগঞ্জ"
],

"খুলনা":[
"বাগেরহাট","চুয়াডাঙ্গা","যশোর","ঝিনাইদহ",
"খুলনা","কুষ্টিয়া","মাগুরা","মেহেরপুর",
"নড়াইল","সাতক্ষীরা"
],

"বরিশাল":[
"বরগুনা","বরিশাল","ভোলা","ঝালকাঠি",
"পটুয়াখালী","পিরোজপুর"
],

"সিলেট":[
"হবিগঞ্জ","মৌলভীবাজার","সুনামগঞ্জ","সিলেট"
],

"রংপুর":[
"দিনাজপুর","গাইবান্ধা","কুড়িগ্রাম",
"লালমনিরহাট","নীলফামারী","পঞ্চগড়",
"রংপুর","ঠাকুরগাঁও"
],

"ময়মনসিংহ":[
"জামালপুর","ময়মনসিংহ","নেত্রকোনা","শেরপুর"
]

};

const icons={
"ঢাকা":"🏙️",
"চট্টগ্রাম":"🏖️",
"রাজশাহী":"🌾",
"খুলনা":"🌳",
"বরিশাল":"🚤",
"সিলেট":"🍃",
"রংপুর":"🌻",
"ময়মনসিংহ":"🌿"
};

const places=[

{
name:"লালবাগ কেল্লা",
district:"ঢাকা",
description:"ঢাকার ঐতিহাসিক মুঘল স্থাপনা।"
},

{
name:"আহসান মঞ্জিল",
district:"ঢাকা",
description:"পুরান ঢাকার ঐতিহাসিক প্রাসাদ।"
},

{
name:"কক্সবাজার সমুদ্র সৈকত",
district:"কক্সবাজার",
description:"বাংলাদেশের বিখ্যাত সমুদ্র সৈকত।"
},

{
name:"সেন্ট মার্টিন",
district:"কক্সবাজার",
description:"বাংলাদেশের প্রবাল দ্বীপ।"
},

{
name:"সাজেক ভ্যালি",
district:"রাঙামাটি",
description:"পাহাড় ও মেঘের অপরূপ সৌন্দর্য।"
},

{
name:"জাফলং",
district:"সিলেট",
description:"পাহাড়, নদী ও পাথরের সৌন্দর্য।"
},

{
name:"সুন্দরবন",
district:"খুলনা",
description:"বিশ্বের বৃহৎ ম্যানগ্রোভ বনাঞ্চল।"
},

{
name:"ষাট গম্বুজ মসজিদ",
district:"বাগেরহাট",
description:"ঐতিহাসিক স্থাপত্য নিদর্শন।"
},

{
name:"মহাস্থানগড়",
district:"বগুড়া",
description:"প্রাচীন প্রত্নতাত্ত্বিক স্থান।"
},

{
name:"কান্তজিউ মন্দির",
district:"দিনাজপুর",
description:"প্রাচীন পোড়ামাটির অলংকরণসমৃদ্ধ মন্দির।"
}

];

const divisionBox=
document.getElementById("divisions");

Object.keys(data).forEach(division=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`
<div class="icon">${icons[division]}</div>
<h3>${division} বিভাগ</h3>
<p>${data[division].length} জেলা</p>
`;

card.onclick=()=>showDistricts(division);

divisionBox.appendChild(card);

});

function showDistricts(division){

const box=document.getElementById("districts");

box.innerHTML=`<h3>${division} বিভাগের জেলা</h3>`;

data[division].forEach(district=>{

const button=document.createElement("span");

button.className="district";
button.textContent=district;

button.onclick=()=>{

document.getElementById("search").value=district;

searchPlaces();

};

box.appendChild(button);

});

}

function showPlaces(list){

const box=document.getElementById("places");

box.innerHTML="";

if(list.length===0){

box.innerHTML="<p>কোনো তথ্য পাওয়া যায়নি।</p>";

return;

}

list.forEach(place=>{

const item=document.createElement("div");

item.className="place";

const title=document.createElement("h3");
title.textContent="🏞️ "+place.name;

const district=document.createElement("p");
district.textContent="জেলা: "+place.district;

const description=document.createElement("p");
description.textContent=place.description;

const link=document.createElement("a");

link.href=
"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(place.name+" Bangladesh");

link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="Google Maps-এ দেখুন ↗";

item.append(title,district,description,link);

box.appendChild(item);

});

}

function searchPlaces(){

const value=document
.getElementById("search")
.value.trim().toLowerCase();

const results=places.filter(place=>

place.name.toLowerCase().includes(value)||
place.district.toLowerCase().includes(value)

);

showPlaces(results);

}

showPlaces(places);

</script>

</body>
</html>
